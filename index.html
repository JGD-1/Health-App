<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14181f">
  <meta name="description" content="Daily tracker: food, mood, drinks and weight, shared with your partner.">
  <title>Daily Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="nav-btn" id="prev" aria-label="Previous">‹</button>
    <div class="date-block">
      <div class="date-main" id="title">Today</div>
      <button class="date-sub" id="backBtn" hidden>Back to today</button>
    </div>
    <button class="nav-btn" id="next" aria-label="Next">›</button>
  </header>

  <main>
    <!-- DAY -->
    <section class="view" id="view-day">
      <div class="card">
        <div class="card-head"><h2>Food</h2><span class="muted" id="foodHint"></span></div>
        <div class="food-row" id="foodRow"></div>
        <p class="anchor" id="foodAnchor"></p>
      </div>

      <div class="card">
        <div class="card-head"><h2>Mood</h2><span class="muted" id="moodHint"></span></div>
        <div class="food-row" id="moodRow"></div>
        <p class="anchor" id="moodAnchor"></p>
      </div>

      <div class="card">
        <div class="card-head"><h2>Drinks</h2><span class="muted" id="drinkSummary"></span></div>
        <div class="counters" id="counters"></div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Weight</h2></div>
        <div class="weight-line"><div id="weightValue"></div><button class="btn" id="weightBtn">Add weight</button></div>
      </div>

      <div class="card partner-card" id="partnerToday" hidden></div>
    </section>

    <!-- OVERVIEW -->
    <section class="view" id="view-overview" hidden>
      <div class="seg" id="periodSeg">
        <button data-v="week">Week</button><button data-v="month">Month</button><button data-v="year">Year</button>
      </div>
      <div class="seg who" id="whoSeg" hidden>
        <button data-v="me">Me</button><button data-v="both">Both</button><button data-v="partner">Partner</button>
      </div>
      <div id="overview"></div>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="view-settings" hidden>
      <div class="card" id="shareCard"></div>

      <div class="card">
        <h2>Your data</h2>
        <p class="muted small" id="storageInfo"></p>
        <button class="btn wide" id="exportJson">Download backup (JSON)</button>
        <button class="btn wide" id="exportCsv">Download spreadsheet (CSV)</button>
        <label class="btn wide file-btn">Restore from backup<input type="file" id="importFile" accept="application/json,.json" hidden></label>
        <button class="btn danger wide" id="deleteAll">Delete all data</button>
      </div>

      <div class="card">
        <h2>Food score guide</h2>
        <ol class="guide" id="foodGuide"></ol>
      </div>
      <p class="muted small center" id="versionInfo"></p>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="day" class="active"><span class="ti">●</span>Today</button>
    <button data-view="overview"><span class="ti">▦</span>Overview</button>
    <button data-view="settings"><span class="ti">⚙</span>Settings</button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
