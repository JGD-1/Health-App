<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14181f">
  <meta name="description" content="Daily tracker: food, mood, drinks and weight, shared with your partner.">
  <title>Dagtracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="nav-btn" id="prev" aria-label="Vorige">‹</button>
    <div class="date-block">
      <div class="date-main" id="title">Today</div>
      <button class="date-sub" id="backBtn" hidden>Back to today</button>
    </div>
    <button class="nav-btn" id="next" aria-label="Volgende">›</button>
  </header>

  <main>
    <!-- DAY -->
    <section class="view" id="view-day">
      <div class="card">
        <div class="card-head"><h2 data-t>Food</h2><span class="muted" id="foodHint"></span></div>
        <div class="food-row" id="foodRow"></div>
        <p class="anchor" id="foodAnchor"></p>
      </div>

      <div class="card">
        <div class="card-head"><h2 data-t>Mood</h2><span class="muted" id="moodHint"></span></div>
        <div class="food-row" id="moodRow"></div>
        <p class="anchor" id="moodAnchor"></p>
      </div>

      <div class="card">
        <div class="card-head"><h2 data-t>Drinks</h2><span class="muted" id="drinkSummary"></span></div>
        <div class="counters" id="counters"></div>
      </div>

      <div class="card">
        <div class="card-head"><h2 data-t>Weight</h2></div>
        <div class="weight-line"><div id="weightValue"></div><button class="btn" id="weightBtn">Add weight</button></div>
      </div>

      <div class="card partner-card" id="partnerToday" hidden></div>
    </section>

    <!-- OVERVIEW -->
    <section class="view" id="view-overview" hidden>
      <div class="seg" id="periodSeg">
        <button data-v="week" data-t>Week</button><button data-v="month" data-t>Month</button><button data-v="year" data-t>Year</button>
      </div>
      <div class="seg who" id="whoSeg" hidden>
        <button data-v="me" data-t>Me</button><button data-v="both" data-t>Both</button><button data-v="partner" data-t>Partner</button>
      </div>
      <div id="overview"></div>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="view-settings" hidden>
      <div class="card" id="reminderCard"></div>

      <div class="card" id="shareCard"></div>

      <div class="card">
        <h2>Taal / Language</h2>
        <div class="seg" id="langSeg"><button data-v="nl">Nederlands</button><button data-v="en">English</button></div>
      </div>

      <div class="card">
        <h2 data-t>Your data</h2>
        <p class="muted small" id="storageInfo"></p>
        <button class="btn wide" id="exportJson" data-t>Download backup (JSON)</button>
        <button class="btn wide" id="exportCsv" data-t>Download spreadsheet (CSV)</button>
        <label class="btn wide file-btn"><span data-t>Restore from backup</span><input type="file" id="importFile" accept="application/json,.json" hidden></label>
        <button class="btn danger wide" id="deleteAll" data-t>Delete all data</button>
      </div>

      <div class="card">
        <h2 data-t>Food score guide</h2>
        <ol class="guide" id="foodGuide"></ol>
      </div>
      <p class="muted small center" id="versionInfo"></p>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="day" class="active"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg></span><span data-t>Today</span></button>
    <button data-view="overview"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M7.5 13h2M11 13h2M14.5 13h2M7.5 16.5h2M11 16.5h2"/></svg></span><span data-t>Overview</span></button>
    <button data-view="settings"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span><span data-t>Settings</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
