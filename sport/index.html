<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c12">
  <meta name="description" content="Workouts for the time you have: gym, bodyweight or running, with skills that level up.">
  <title>Training</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="date-main" id="title">Training</div>
    <button class="lvl-chip" id="lvlChip">Level 1</button>
  </header>

  <main>
    <section class="view" id="view-train"></section>
    <section class="view" id="view-workout" hidden></section>
    <section class="view" id="view-log" hidden></section>
    <section class="view" id="view-skills" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>

  <nav class="tabbar">
    <button data-view="train" class="active"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span><span data-t>Training</span></button>
    <button data-view="log"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M7.5 13h2M11 13h2M14.5 13h2M7.5 16.5h2M11 16.5h2"/></svg></span><span data-t>Log</span></button>
    <button data-view="skills"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.3 6.8 19.1l1-5.8L3.5 9.2l5.9-.8z"/></svg></span><span data-t>Skills</span></button>
    <button data-view="settings"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span><span data-t>Settings</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="i18n.js"></script>
  <script src="exercises.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
